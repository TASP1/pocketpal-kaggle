name: Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (cheap after warm cache; blacksmith-8vcpu for cold/fast)"
        type: choice
        options:
          - ubuntu-24.04
          - blacksmith-8vcpu-ubuntu-2404
          - blacksmith-2vcpu-ubuntu-2404
        default: ubuntu-24.04

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk-debug:
    name: Build prod debug APK
    # Default: GitHub-hosted (free on public repo) — warm Gradle/yarn cache from prior Blacksmith run
    # Manual: pick blacksmith-8vcpu for fastest cold rebuild
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4g'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Create dummy google-services.json for CI
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.pocketpalai"
                  }
                },
                "api_key": [{ "current_key": "dummy-api-key-for-ci-builds" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": {
                    "package_name": "com.pocketpalai.e2e"
                  }
                },
                "api_key": [{ "current_key": "dummy-api-key-for-ci-builds" }]
              }
            ]
          }
          EOL

      - name: Create dummy .env for CI
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOL

      - name: Yarn install
        run: yarn install --frozen-lockfile

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Assemble prod debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleProdDebug --build-cache --parallel --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-kaggle-prod-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/prod/debug/*.apk
            android/app/build/outputs/apk/**/prod*.apk
          if-no-files-found: error
          retention-days: 14
